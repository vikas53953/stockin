[project]
name = "stockin"
version = "0.1.0"
description = "Private, read-only add/trim/exit decisions for one investor in Indian markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "casparser>=1.4.1,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "uvicorn>=0.30,<1",
]

[project.scripts]
stockin = "stockin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx>=0.27",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockin"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
