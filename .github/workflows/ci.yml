name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Drive the installed CLI
        run: |
          uv tool install .
          mkdir -p "$RUNNER_TEMP/data"
          STOCKIN_DATA="$RUNNER_TEMP/data" stockin doctor --json
