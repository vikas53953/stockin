name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Drive the installed CLI
        run: |
          uv tool install .
          mkdir -p "$RUNNER_TEMP/data"
          STOCKIN_DATA="$RUNNER_TEMP/data" stockin doctor --json

  # The owner runs Stockin on Windows. The data-folder, doctor and install
  # lines match the UAT checklist, one command per line, in Windows
  # PowerShell 5.1 and 7. Differences from the checklist: uv comes from
  # setup-uv, Stockin installs from this checkout, PATH is set by hand instead
  # of opening a new window, setx is skipped, and import uses a JSON fixture
  # from the CLI, not a PDF through the web page.
  windows-install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (as the checklist does, from this checkout)
        run: |
          $PSVersionTable.PSVersion.ToString()
          uv tool install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv tool update-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Data folder, doctor, import, reconcile
        run: |
          $env:PATH = "$(uv tool dir --bin);$env:PATH"
          New-Item -ItemType Directory -Force "$HOME\stockin-data" | Out-Null
          $env:STOCKIN_DATA = "$HOME\stockin-data"
          stockin doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin import cas tests\fixtures\cas\mf-2026-01.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin import cas tests\fixtures\cas\mf-2026-01.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin reconcile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Drop 2 on Windows (prices, insights, verdicts, thesis, web)
        run: |
          $env:PATH = "$(uv tool dir --bin);$env:PATH"
          $env:STOCKIN_DATA = "$HOME\stockin-data"
          stockin import cas tests\fixtures\cas\demat-2026-02.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin prices import tests\fixtures\eod\bhavcopy-sample.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin prices import tests\fixtures\eod\NAVAll-sample.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin holdings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin insights
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin thesis set INE009A01021 --why "Quality compounder" --target 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin verdicts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $web = Start-Process -FilePath stockin -ArgumentList "web", "--port", "8765" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $home_page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/; $ok = $true; break } catch { }
          }
          if (-not $ok) { Stop-Process -Id $web.Id; Write-Error "stockin web did not start"; exit 1 }
          $holding = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/holding/INE009A01021
          Stop-Process -Id $web.Id
          if ($home_page.StatusCode -ne 200 -or $home_page.Content -notmatch "What to decide") { Write-Error "home page"; exit 1 }
          if ($holding.StatusCode -ne 200 -or $holding.Content -notmatch "Quality compounder") { Write-Error "holding page"; exit 1 }
          "home and holding page: 200, decide tile and thesis shown"
      - name: Sprint 2 on Windows (assets, target mix, net worth)
        run: |
          $env:PATH = "$(uv tool dir --bin);$env:PATH"
          $env:STOCKIN_DATA = "$HOME\stockin-data"
          stockin asset add bank --label "SBI savings" --value 250000 --as-of 2026-11-01
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin asset add epf --value 845000 --as-of 2026-10-31
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin asset add fd --label "HDFC FD" --principal 200000 --rate 7.1 --start 2026-04-01 --months 12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin asset add gold --grams 20 --rate-per-gram 7650
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin asset add loan --label "Home loan" --value 1200000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin target set equity=60 debt=20 gold=10 cash=10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin asset list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin networth
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nw = stockin networth --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bps = ($nw.slices | Measure-Object -Property bps -Sum).Sum
          if ($nw.total.paise -ne ($nw.owned.paise - $nw.owed.paise) -or $bps -ne 10000) { Write-Error "net worth does not add up"; exit 1 }
          stockin asset close loan --label "home LOAN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ErrorActionPreference = "Continue"  # PowerShell 5.1 turns a native command's stderr into an error record
          stockin asset add bank --value 1.234 2>&1 | Out-String
          $ErrorActionPreference = "Stop"
          if ($LASTEXITCODE -ne 2) { Write-Error "a 3-decimal amount was not refused"; exit 1 }
          stockin doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "net worth adds up: total = owned - owed, mix = 100%"
      - name: Sprint 3 on Windows (alerts)
        run: |
          $env:PATH = "$(uv tool dir --bin);$env:PATH"
          $env:STOCKIN_DATA = "$HOME\stockin-data"
          stockin alerts check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin alerts check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin alerts list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stockin alerts send
          if ($LASTEXITCODE -ne 2) { Write-Error "alerts send before connect should exit 2"; exit 1 }
          stockin doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0
      - name: Live price download on Windows (informational; NSE may refuse CI machines)
        continue-on-error: true
        run: |
          $env:PATH = "$(uv tool dir --bin);$env:PATH"
          $env:STOCKIN_DATA = "$HOME\stockin-data"
          stockin prices fetch
          exit $LASTEXITCODE
